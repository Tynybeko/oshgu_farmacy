{% extends 'base.html' %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<h1 class="h3 mb-4">{{ title }}</h1>
<div class="card table-card" style="max-width:600px">
    <div class="card-body p-4">
        <form method="post">
            {% csrf_token %}
            {% for field in form %}
            <div class="mb-3"><label class="form-label">{{ field.label }}</label>{{ field }}</div>
            {% endfor %}
            <button type="submit" class="btn btn-primary">Сохранить</button>
            <a href="{% url 'supplier_list' %}" class="btn btn-outline-secondary">Отмена</a>
        </form>
    </div>
</div>
{% endblock %}
