{% extends 'base.html' %}
{% block title %}Сотрудники{% endblock %}
{% block content %}
<div class="d-flex justify-content-between mb-4">
    <h1 class="h3">Сотрудники</h1>
    <a href="{% url 'employee_create' %}" class="btn btn-primary">Добавить</a>
</div>
<div class="card table-card">
    <table class="table table-hover mb-0">
        <thead><tr><th>ФИО</th><th>Должность</th><th>Роль</th><th>Логин</th><th></th></tr></thead>
        <tbody>
        {% for e in employees %}
        <tr>
            <td>{{ e.fullname }}</td>
            <td>{{ e.position }}</td>
            <td><span class="badge bg-secondary">{{ e.get_role_display }}</span></td>
            <td>{{ e.user.username }}</td>
            <td><a href="{% url 'employee_edit' e.pk %}" class="btn btn-sm btn-outline-secondary"><i class="bi bi-pencil"></i></a></td>
        </tr>
        {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
